<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">Krish Mehan</title>
<desc id="desc">Black and crimson cinematic systems banner inspired by Krish Mehan's visual identity.</desc>
<defs>
  <radialGradient id="void" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#000"/>
    <stop offset=".55" stop-color="#020202"/>
    <stop offset=".72" stop-color="#21070a"/>
    <stop offset=".86" stop-color="#73141d"/>
    <stop offset="1" stop-color="#ff4958" stop-opacity=".05"/>
  </radialGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#6d1017"/>
    <stop offset=".45" stop-color="#d72f3f"/>
    <stop offset=".75" stop-color="#ff6a78"/>
    <stop offset="1" stop-color="#7f111b"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="micro" width="16" height="16" patternUnits="userSpaceOnUse">
    <path d="M16 0H0V16" fill="none" stroke="#ff5a68" stroke-opacity=".035" stroke-width=".6"/>
  </pattern>
  <clipPath id="eyeClip"><rect x="1084" y="80" width="230" height="145" rx="3"/></clipPath>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .s{font-family:Arial,Helvetica,sans-serif}
    .scan{animation:scan 7s linear infinite}
    .pulse{animation:pulse 4.5s ease-in-out infinite}
    .flick{animation:flick 5s steps(1,end) infinite}
    @keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(480px)}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.25}95%{opacity:.9}97%{opacity:.35}}
  </style>
</defs>

<rect width="1400" height="420" fill="#020202"/>
<rect width="1400" height="420" fill="url(#micro)"/>

<!-- atmospheric red haze -->
<ellipse cx="720" cy="215" rx="630" ry="175" fill="#5b0c12" opacity=".08"/>
<rect class="scan" x="0" y="-70" width="1400" height="42" fill="#ff3f51" opacity=".035"/>

<!-- left singularity -->
<g transform="translate(250 205)">
  <circle r="124" fill="url(#void)"/>
  <ellipse rx="210" ry="45" fill="none" stroke="#ff5968" stroke-opacity=".26" stroke-width="2"/>
  <ellipse rx="190" ry="34" fill="none" stroke="#b3212e" stroke-width="6" stroke-opacity=".34" filter="url(#glow)"/>
  <ellipse rx="150" ry="25" fill="none" stroke="#ff7380" stroke-width="2" stroke-opacity=".42"/>
  <circle r="71" fill="#000" stroke="#b51e2b" stroke-width="1.5"/>
  <circle r="95" fill="none" stroke="#ff4a59" stroke-opacity=".18"/>
  <path d="M-198 -9 C-105 -54, -36 -51, 0 -20 C38 13, 112 31, 205 8" fill="none" stroke="url(#red)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M-182 13 C-93 45, -22 49, 14 20 C55 -14, 119 -34, 184 -20" fill="none" stroke="#ff5a68" stroke-width="1.4" opacity=".65"/>
</g>

<!-- side mantra -->
<g class="m" font-size="12" letter-spacing="5" fill="#d64a57">
  <text x="55" y="82">BUILD</text>
  <text x="55" y="108">EXPLORE</text>
  <text x="55" y="134">SYSTEMS</text>
  <text x="55" y="160">REPEAT</text>
</g>

<!-- central hand / transmission abstraction -->
<g transform="translate(530 95)" opacity=".82">
  <rect x="0" y="0" width="350" height="160" fill="none" stroke="#7a161f" stroke-width="1"/>
  <path d="M18 116 C80 88,124 95,162 74 C196 55,224 42,266 51 C295 58,319 77,340 92" fill="none" stroke="#ff4e5e" stroke-width="2.1" filter="url(#glow)"/>
  <path d="M26 124 C72 110,105 112,147 96 M147 96 L180 72 M180 72 L202 84 M180 72 L192 51 M180 72 L164 54 M202 84 L235 72 M235 72 L254 54 M235 72 L260 77" fill="none" stroke="#b82b37" stroke-width="1.2"/>
  <circle cx="180" cy="72" r="4" fill="#ff5968" class="pulse"/>
  <circle cx="235" cy="72" r="3" fill="#ff5968" class="pulse"/>
  <g class="m" font-size="10" fill="#9d313b" letter-spacing="3">
    <text x="17" y="24">IDEA / SIGNAL</text>
    <text x="215" y="145">→ SYSTEM</text>
  </g>
</g>

<!-- technical orbit / diagram -->
<g transform="translate(930 95)" stroke="#ad2631" fill="none" opacity=".48">
  <circle cx="74" cy="74" r="52"/>
  <ellipse cx="74" cy="74" rx="70" ry="22"/>
  <ellipse cx="74" cy="74" rx="26" ry="68" transform="rotate(28 74 74)"/>
  <path d="M18 118L130 28M26 29L126 122" opacity=".45"/>
  <circle cx="74" cy="74" r="4" fill="#ff5664" stroke="none"/>
</g>

<!-- eye -->
<g clip-path="url(#eyeClip)" class="flick">
  <rect x="1084" y="80" width="230" height="145" fill="#070707" stroke="#77141d"/>
  <path d="M1100 152 Q1199 85 1298 152 Q1199 219 1100 152Z" fill="none" stroke="#d43b49" stroke-width="2"/>
  <circle cx="1199" cy="152" r="32" fill="none" stroke="#ff5968" stroke-width="2"/>
  <circle cx="1199" cy="152" r="12" fill="#160205" stroke="#ff5968"/>
  <path d="M1084 106H1314M1084 131H1314M1084 176H1314M1084 201H1314" stroke="#ff5968" stroke-opacity=".08"/>
  <path d="M1120 95L1278 211M1275 96L1120 210" stroke="#ff5968" stroke-opacity=".08"/>
</g>

<!-- small moon -->
<circle cx="1055" cy="245" r="22" fill="#9c1f2a" opacity=".7"/>
<circle cx="1048" cy="239" r="5" fill="#421016" opacity=".8"/>
<circle cx="1064" cy="252" r="3" fill="#421016"/>

<!-- identity -->
<g transform="translate(760 302)">
  <path d="M0 20H420" stroke="#4e0b11"/>
  <text x="0" y="0" class="m" font-size="12" letter-spacing="5" fill="#b7313c">KRISH / MEHAN</text>
  <text x="0" y="54" class="s" font-size="38" font-weight="700" letter-spacing="7" fill="#e4414f">KRISH MEHAN</text>
  <text x="2" y="82" class="m" font-size="11" letter-spacing="3" fill="#8e2931">FOUNDER · QUANT · AUTONOMY · DECISION SYSTEMS</text>
</g>

<!-- micro copy right -->
<g class="m" font-size="10" letter-spacing="4" fill="#8f252f">
  <text x="1230" y="285">CODE</text>
  <text x="1230" y="305">RESEARCH</text>
  <text x="1230" y="325">CREATE</text>
  <text x="1230" y="345">AUTOMATE</text>
  <text x="1230" y="365">EVOLVE</text>
</g>

<!-- footer coordinate line -->
<path d="M48 392H1350" stroke="#3f0a0f"/>
<circle cx="48" cy="392" r="2.5" fill="#c92c39"/>
<circle cx="1350" cy="392" r="2.5" fill="#c92c39"/>
<text x="55" y="409" class="m" font-size="9" letter-spacing="3" fill="#60202a">OBSERVE → MODEL → SIMULATE → VERIFY → ACT</text>
</svg>